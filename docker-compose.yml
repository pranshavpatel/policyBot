# version: "3.9"
services:
  api:
    build: ./
    container_name: policybot-api
    env_file:
      - .env   # GROQ_API_KEY, JWT_SECRET, etc. — see .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - CHROMA_DIR=/data/chroma
      - DATABASE_URL=sqlite:////data/policybot.db
    volumes:
      - chroma_data:/data/chroma
      - db_data:/data
    ports:
      - "8000:8000"
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: "http://localhost:8000"
    container_name: policybot-web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  chroma_data:
  db_data:
